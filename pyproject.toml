[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vbao-saler"
version = "0.1.0"
description = "Evidence-backed outbound lead discovery agent"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "pydantic==2.12.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[project.scripts]
vbao = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
